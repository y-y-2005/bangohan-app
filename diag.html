<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同期診断ツール - ばんごはん、いる？</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    background: #FAF7F2; color: #2D2725; line-height: 1.6;
    padding: 16px; max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #786F6A; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #E6DFD5; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin-bottom: 8px; }
  label { display: block; font-size: 12px; color: #786F6A; margin-bottom: 4px; font-weight: 700; }
  input {
    width: 100%; padding: 10px; border: 1px solid #E6DFD5; border-radius: 8px;
    font-size: 14px; margin-bottom: 10px; font-family: inherit;
  }
  button {
    background: #E05A47; color: #fff; border: none; border-radius: 10px;
    padding: 12px 16px; font-size: 15px; font-weight: 700; width: 100%;
    cursor: pointer; font-family: inherit;
  }
  button.sec { background: #F3EFE9; color: #2D2725; border: 1px solid #E6DFD5; }
  button:disabled { opacity: 0.5; }
  .row { display: flex; gap: 8px; }
  pre {
    background: #F3EFE9; border-radius: 8px; padding: 10px; font-size: 12px;
    white-space: pre-wrap; word-break: break-all; margin-top: 10px;
    max-height: 320px; overflow: auto; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .r { padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
  .ok { background: #E7F6EC; color: #1B5E20; }
  .ng { background: #FDE8E5; color: #C62828; }
  .wa { background: #FFF3E0; color: #E65100; }
  .in { background: #F3EFE9; color: #55504D; }
  .note { font-size: 12px; color: #786F6A; margin-top: 8px; }
</style>
</head>
<body>

<h1>同期診断ツール</h1>
<div class="sub">アプリ本体から切り離して、同期部分だけを検査します。家族の端末それぞれで開いてください。</div>

<div class="card">
  <h2>1. 接続先の設定</h2>
  <label for="bucket">KVdb バケットID</label>
  <input id="bucket" value="AeVidZgwuAzpw3ipmY5xhR">
  <label for="key">キー名</label>
  <input id="key" value="group_BINGO2026">
  <button onclick="runAll()" id="runBtn">診断を実行する</button>
</div>

<div class="card" id="envCard">
  <h2>2. 実行環境</h2>
  <div id="envOut"><div class="r in">「診断を実行する」を押してください</div></div>
</div>

<div class="card">
  <h2>3. 通信テスト</h2>
  <div id="netOut"><div class="r in">未実行</div></div>
  <pre id="raw" style="display:none;"></pre>
</div>

<div class="card">
  <h2>4. 判定</h2>
  <div id="verdict"><div class="r in">未実行</div></div>
</div>

<div class="card">
  <h2>5. バケットを新規作成する</h2>
  <div class="note">
    バケットが存在しない場合はここで作成します。作成にはメールアドレスが必要です（KVdb社に送信されます）。
    作成後に表示されるIDを、上の「バケットID」と app.js の SYNC_ENDPOINT に貼り替えてください。
  </div>
  <label for="email" style="margin-top:10px;">メールアドレス</label>
  <input id="email" type="email" placeholder="your@example.com">
  <button class="sec" onclick="createBucket()">バケットを作成する</button>
  <div id="createOut"></div>
</div>

<script>
const $ = id => document.getElementById(id);
function line(el, cls, text) {
  const d = document.createElement('div');
  d.className = 'r ' + cls;
  d.textContent = text;
  $(el).appendChild(d);
}
function clear(el) { $(el).innerHTML = ''; }

function checkEnv() {
  clear('envOut');
  const proto = location.protocol;
  line('envOut', 'in', '現在のURL: ' + (location.href || '(不明)'));

  if (proto === 'file:') {
    line('envOut', 'ng', 'file:// で開いています。この場合 Service Worker は登録できず、外部への通信もブラウザに拒否されることがあります。必ずWebサーバ経由(https://)で配信してください。');
  } else if (proto === 'https:') {
    line('envOut', 'ok', 'https で配信されています。');
  } else if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    line('envOut', 'wa', 'localhost です。手元の検証には使えますが、他の端末からは開けません。');
  } else {
    line('envOut', 'wa', 'プロトコル: ' + proto + ' (https を推奨)');
  }

  line('envOut', navigator.onLine ? 'ok' : 'ng',
       navigator.onLine ? 'ネットワーク: オンライン' : 'ネットワーク: オフライン判定');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => {
      if (rs.length === 0) {
        line('envOut', 'in', 'Service Worker: 未登録');
      } else {
        rs.forEach(r => {
          const sw = r.active || r.installing || r.waiting;
          line('envOut', 'wa', 'Service Worker 登録あり: ' + (sw ? sw.scriptURL : '(不明)') +
               ' — 古いコードが配信されている可能性があります。開発者ツールから登録解除してください。');
        });
      }
    });
  }
}

let lastResults = {};

async function runAll() {
  $('runBtn').disabled = true;
  checkEnv();
  clear('netOut');
  clear('verdict');
  $('raw').style.display = 'none';

  const bucket = $('bucket').value.trim();
  const key = $('key').value.trim();
  const base = 'https://kvdb.io/' + bucket;
  const url = base + '/' + key;
  lastResults = {};

  // --- テストA: 読み取り ---
  try {
    const res = await fetch(url + '?_=' + Date.now(), { cache: 'no-store' });
    lastResults.getStatus = res.status;
    const body = await res.text();
    lastResults.getBody = body;

    const remain = res.headers.get('X-Ratelimit-Remaining');
    if (remain !== null) {
      lastResults.remain = remain;
      line('netOut', Number(remain) > 50 ? 'ok' : 'ng', 'レート制限の残り: ' + remain + ' / 1000 (毎時)');
    } else {
      line('netOut', 'in', 'レート制限ヘッダは読み取れません (CORSで非公開)');
    }

    if (res.status === 200) {
      line('netOut', 'ok', 'A. 読み取り成功 (200)。データ長 ' + body.length + ' バイト');
      $('raw').style.display = 'block';
      $('raw').textContent = body.slice(0, 4000);
    } else if (res.status === 404) {
      line('netOut', 'wa', 'A. 読み取り 404。バケットが無いか、まだ一度も書き込めていません。');
    } else if (res.status === 429) {
      line('netOut', 'ng', 'A. 読み取り 429。レート制限に達しています。');
    } else {
      line('netOut', 'ng', 'A. 読み取り失敗。HTTP ' + res.status);
    }
  } catch (e) {
    lastResults.getError = String(e);
    line('netOut', 'ng', 'A. 読み取りが例外で失敗: ' + e + ' (CORS拒否、通信遮断、またはサービス停止)');
  }

  // --- テストB: 書き込み ---
  const probeKey = '__diag_' + Math.random().toString(36).slice(2, 8);
  const probeVal = 'ok_' + Date.now();
  try {
    const res = await fetch(base + '/' + probeKey, { method: 'POST', body: probeVal });
    lastResults.postStatus = res.status;
    if (res.ok) {
      line('netOut', 'ok', 'B. 書き込み成功 (' + res.status + ')');
    } else if (res.status === 404) {
      line('netOut', 'ng', 'B. 書き込み 404。このバケットIDは存在しません。');
    } else if (res.status === 401 || res.status === 403) {
      line('netOut', 'ng', 'B. 書き込み拒否 (' + res.status + ')。書き込みキーが必要な設定です。');
    } else if (res.status === 429) {
      line('netOut', 'ng', 'B. 書き込み 429。レート制限です。');
    } else {
      line('netOut', 'ng', 'B. 書き込み失敗。HTTP ' + res.status);
    }
  } catch (e) {
    lastResults.postError = String(e);
    line('netOut', 'ng', 'B. 書き込みが例外で失敗: ' + e);
  }

  // --- テストC: 往復確認 ---
  if (lastResults.postStatus && lastResults.postStatus < 300) {
    try {
      const res = await fetch(base + '/' + probeKey + '?_=' + Date.now(), { cache: 'no-store' });
      const got = await res.text();
      lastResults.roundTrip = (got.trim() === probeVal);
      if (lastResults.roundTrip) {
        line('netOut', 'ok', 'C. 書き込んだ値を読み戻せました。往復は正常です。');
      } else {
        line('netOut', 'ng', 'C. 読み戻した値が一致しません。期待 "' + probeVal + '" / 実際 "' + got.slice(0, 40) + '" — キャッシュを疑ってください。');
      }
    } catch (e) {
      line('netOut', 'ng', 'C. 読み戻しが例外で失敗: ' + e);
    }
  }

  judge();
  $('runBtn').disabled = false;
}

function judge() {
  clear('verdict');
  const r = lastResults;

  if (r.getError && r.postError) {
    line('verdict', 'ng', 'kvdb.io に一切到達できていません。サービス停止、CORS拒否、または回線の遮断です。別の同期先への移行を検討してください。');
    return;
  }
  if (r.postStatus === 404 || r.getStatus === 404 && r.postStatus === 404) {
    line('verdict', 'ng', '原因確定: このバケットIDは存在しません。下の「5」でバケットを作成し、新しいIDに差し替えてください。これが直れば同期は動きます。');
    return;
  }
  if (r.getStatus === 429 || r.postStatus === 429) {
    line('verdict', 'ng', '原因確定: レート制限(毎時1000)超過です。ポーリング間隔を延ばすか、有料プランか別サービスへ移行してください。1時間待てば復帰します。');
    return;
  }
  if (r.roundTrip === false) {
    line('verdict', 'wa', '通信自体は成功していますが、書いた値を読み戻せていません。キャッシュ層を疑ってください。');
    return;
  }
  if (r.roundTrip === true && r.getStatus === 404) {
    line('verdict', 'wa', 'バケットは正常です。ただし本番キーにまだデータがありません。アプリ側が一度も書き込めていない状態です。');
    return;
  }
  if (r.roundTrip === true && r.getStatus === 200) {
    line('verdict', 'ok', 'バケットも通信も正常です。同期先は問題ありません。原因はアプリ側のコードにあります。上の「3」に表示された実データを確認してください。');
    line('verdict', 'in', '確認点: 家族の端末で「バケットID」と「キー名」が完全に一致しているか。招待コードを変えるとキー名が変わります。');
    return;
  }
  line('verdict', 'wa', '判定できませんでした。上のテスト結果をそのまま貼って相談してください。');
}

async function createBucket() {
  const email = $('email').value.trim();
  clear('createOut');
  if (!email) {
    line('createOut', 'ng', 'メールアドレスを入力してください。');
    return;
  }
  try {
    const res = await fetch('https://kvdb.io/', {
      method: 'POST',
      body: 'email=' + encodeURIComponent(email)
    });
    const id = (await res.text()).trim();
    if (res.ok && id) {
      line('createOut', 'ok', '作成できました。バケットID: ' + id);
      line('createOut', 'in', 'このIDを上の入力欄と app.js の SYNC_ENDPOINT に貼り替えて、もう一度診断してください。');
      $('bucket').value = id;
    } else {
      line('createOut', 'ng', '作成に失敗しました。HTTP ' + res.status + ' / ' + id.slice(0, 200));
    }
  } catch (e) {
    line('createOut', 'ng', '作成が例外で失敗: ' + e);
  }
}
</script>

</body>
</html>
